- name: Pex AI Song Detector API
  description: 'Real-time API that classifies whether an audio track was created by
    an AI music generator (Suno, Udio, Boomy, ElevenLabs, and others) or a human artist,
    returning an is_ai flag, a confidence score, and the predicted model. OAuth 2.0
    client-credentials auth. Also available as a hosted MCP server.'
  humanURL: https://docs.pex.com/ai-song-detector/api-documentation/
  baseURL: https://api.ae.pex.com
  properties:
  - type: Documentation
    url: https://docs.pex.com/ai-song-detector/api-documentation/
  - type: Authentication
    url: authentication/pex-authentication.yml
  - type: MCPServer
    url: mcp/pex-mcp.yml
- name: Pex Search API
  description: 'Real-time automatic content recognition (ACR) API for identifying music
    from audio fingerprints against a registry of 120M+ recordings, resilient to tempo,
    pitch, and partial-obscuring modifications. Asynchronous start-search / check-search
    workflow keyed by lookup_id. OAuth 2.0 client-credentials auth. Currently in private
    testing.'
  humanURL: https://docs.pex.com/search/api-documentation/
  baseURL: https://api.ae.pex.com
  properties:
  - type: Documentation
    url: https://docs.pex.com/search/api-documentation/
