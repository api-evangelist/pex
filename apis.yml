aid: pex
name: Pex
description: 'Pex (part of Vobile since April 2025) is a content-identification and
  digital-rights technology company whose APIs identify recordings, compositions,
  and AI-generated music across digital platforms. Pex operates three developer-facing
  APIs: a Discovery / DRM & CMS API (api.pex.com) for managing rights assets, monitoring
  infringing copies, and running takedowns; a real-time Search API for automatic content
  recognition (ACR) that fingerprints and matches audio even when it has been sped
  up, slowed down, pitch-shifted, or partially obscured against a registry of 120M+
  indexed recordings; and an AI Song Detector API (api.ae.pex.com) that classifies
  whether a track was generated by an AI music model such as Suno, Udio, Boomy, or
  ElevenLabs. Pex also publishes a hosted MCP server (mcp.pex.com) exposing the AI
  Song Detector to agents. Customers include streaming platforms, distributors, publishers,
  production-music libraries, and collection societies.'
